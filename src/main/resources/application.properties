server.port=8080

# Escala de tiempo: cuántos milisegundos reales equivalen a 1 minuto simulado.
# Con 1000, "máximo 10 minutos de espera" del nivel Prioritario = 10 segundos reales.
redxela.sim.minute-ms=1000

# Tamaño del pool de hilos trabajadores (pedidos que pueden procesarse en paralelo).
redxela.workers=12
